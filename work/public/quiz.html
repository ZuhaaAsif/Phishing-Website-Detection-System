<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spot the Phish</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
    }

    #container {
      position: relative;
      display: inline-block;
    }

    .flag {
      position: absolute;
      border: 2px dashed red;
      cursor: pointer;
    }

    .found {
      border: 3px solid green;
    }

    #feedback {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    .correct {
      background: #d4edda;
    }

    .wrong {
      background: #f8d7da;
    }

    #badge {
      background: gold;
      padding: 20px;
      border-radius: 10px;
      display: none;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
   <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="/" class="home-icon-wrapper" id="homeBtn">
                <span class="home-icon-outline" id="homeIconOutline">🏠</span>
                <span class="home-icon-emoji hidden" id="homeIconEmoji">🏠✨</span>
            </a>
            <button class="nav-btn" id="postReviewBtn">✍️ Post a Review</button>
            <button class="nav-btn" id="exploreBtn">🔍 Explore</button>
            <button class="nav-btn" id="quizBtn">🧠 Phishing Quiz</button>
        </div>
        
        <div class="nav-right">
            <!-- User Info (hidden when logged out) -->
            <div id="userInfo" class="user-info hidden">
                <div class="profile-trigger" id="profileTrigger">
                    <div class="profile-avatar" id="profileAvatar">
                        <span id="avatarText"></span>
                    </div>
                    <span id="userName"></span>
                    <i class="fas fa-chevron-down" style="font-size: 12px; margin-left: 5px;"></i>
                </div>
                
                <!-- Dropdown Menu -->
                <div class="profile-dropdown" id="profileDropdown">
                    <div class="dropdown-header">
                        <div class="dropdown-avatar" id="dropdownAvatar">
                            <span id="dropdownAvatarText"></span>
                        </div>
                        <div class="dropdown-user-info">
                            <div class="dropdown-username" id="dropdownUsername"></div>
                            <div class="dropdown-email" id="dropdownEmail"></div>
                        </div>
                    </div>
                    <hr class="dropdown-divider">
                    <button class="dropdown-item" id="myReviewsBtn">
                        <i class="fas fa-star"></i> My Reviews
                    </button>
                    <button class="dropdown-item" id="settingsBtn">
                        <i class="fas fa-cog"></i> Settings
                    </button>
                    <hr class="dropdown-divider">
                    <button class="dropdown-item logout-item" id="logoutBtn">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>
            
            <!-- Sign In Button (visible when logged out) -->
            <button class="nav-btn signin-btn" id="signInBtn">Sign In</button>
        </div>
    </nav>
<h2>Spot the Phish 🕵️</h2>
<p id="progress"></p>

<div id="container">
  <img id="challengeImage" width="600">
</div>

<div id="feedback"></div>

<br>
<button onclick="nextChallenge()">Next Challenge</button>
<button onclick="skipChallenge()">Skip / See Solution</button>

<div id="badge">
  <h2>🎉 You Passed!</h2>
  <p>🛡️ Safety Certificate Badge</p>
</div>

<script>
let challenges = [];
let current = 0;
let foundFlags = [];

// Use the current page origin instead of a hardcoded localhost URL
fetch(window.location.origin + "/api/quiz/challenges")
  .then(res => res.json())
  .then(data => {
    challenges = data.data || data;
    loadChallenge();
  })
  .catch(err => console.error("Failed to load challenges:", err));

function loadChallenge() {
  const container = document.getElementById("container");
  const img = document.getElementById("challengeImage");

  // Clear any existing flag overlays
  container.querySelectorAll(".flag").forEach(e => e.remove());

  foundFlags = [];
  document.getElementById("feedback").style.display = "none";

  const challenge = challenges[current];
  document.getElementById("progress").innerText =
    `Challenge ${current + 1} of ${challenges.length}`;

  // Only render flag hotspots AFTER the image has fully loaded
  // so that clientWidth/clientHeight reflect the real rendered size
  img.onload = () => {
    // Clear again in case onload fires more than once (e.g. cached images)
    container.querySelectorAll(".flag").forEach(e => e.remove());

    challenge.red_flags.forEach(flag => {
      const div = document.createElement("div");
      div.classList.add("flag");

      const imgWidth = img.clientWidth;
      const imgHeight = img.clientHeight;

      div.style.left   = (flag.x_percent     / 100) * imgWidth  + "px";
      div.style.top    = (flag.y_percent     / 100) * imgHeight + "px";
      div.style.width  = (flag.width_percent  / 100) * imgWidth  + "px";
      div.style.height = (flag.height_percent / 100) * imgHeight + "px";

      div.onclick = () => handleClick(flag, div);
      container.appendChild(div);
    });
  };

  // Build the image URL from the current origin so it works on any host/port.
  // The seed stores paths like "/public/images/phish_1.png";
  // Express serves the public folder at "/", so strip the leading "/public".
  const screenshotPath = challenge.screenshot_url.replace("/public", "");
  img.src = window.location.origin + screenshotPath;
}

function handleClick(flag, element) {
  const feedback = document.getElementById("feedback");

  // flag.flag_id is the correct field name from the API (not flag.red_flag_id)
  if (!foundFlags.includes(flag.flag_id)) {
    foundFlags.push(flag.flag_id);
    element.classList.add("found");

    feedback.className = "correct";
    feedback.innerText = "✅ " + flag.explanation;
    feedback.style.display = "block";

    if (foundFlags.length === challenges[current].red_flags.length) {
      setTimeout(() => alert("🎉 All flags found! Click Next Challenge to continue."), 100);
    }
  } else {
    feedback.className = "wrong";
    feedback.innerText = "Already found this one!";
    feedback.style.display = "block";
  }
}

function nextChallenge() {
  if (current < challenges.length - 1) {
    current++;
    loadChallenge();
  } else {
    document.getElementById("container").style.display = "none";
    document.getElementById("badge").style.display = "block";
  }
}

function skipChallenge() {
  // Reveal all remaining flags before moving on
  const challenge = challenges[current];
  challenge.red_flags.forEach(flag => {
    if (!foundFlags.includes(flag.flag_id)) {
      const overlay = document.querySelector(
        `.flag:nth-child(${challenge.red_flags.indexOf(flag) + 2})`
      );
      if (overlay) overlay.classList.add("found");
    }
  });
  nextChallenge();
}
</script>

</body>
</html>
